# ============================================================
# nginx-api.conf - Config completo para Alterna Radio
#
# Uso:
#   sudo cp nginx-api.conf /etc/nginx/sites-available/alternaradio
#   sudo ln -sf /etc/nginx/sites-available/alternaradio /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Reemplazá "radio.alterna.ar" con tu dominio real.
# Ajustá "root" con la ruta real de los archivos del sitio.
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name radio.alterna.ar;

    # Ruta donde están los archivos del sitio
    root /var/www/alternaradio;
    index index.html;

    # Proxy para el API de historial de canciones (Node.js)
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Archivos estáticos (HTML, CSS, JS, imágenes)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
