# ============================================================
# nginx-api.conf
# Agregar este bloque DENTRO del server block existente de nginx
# (en /etc/nginx/sites-available/alternaradio o similar)
#
# Esto hace que /api/* vaya al servidor Node y el resto
# siga siendo servido por nginx como archivos estáticos.
# ============================================================

    # Proxy para el API de historial de canciones
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

