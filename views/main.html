<div class="container main-container">
    <div class="slider-container">
        <div class="slider-wrapper">
            <div class="slider-track" id="sliderTrack">
                <div class="slide">
                    <a href="">
                        <img src="img/hdt_flyer.png" class="slider-image" alt="HDT">
                    </a>
                </div>
                <div class="slide">
                    <a href="">
                        <img src="img/dwm.png" class="slider-image" alt="De Quien Me Olvido">
                    </a>
                </div>
                <div class="slide">
                    <a href="#ies">
                        <img src="img/ies.png" class="slider-image" alt="Informe Económico Semanal">

                </div>

        <!-- Indicadores -->
        <div class="slider-indicators" id="sliderIndicators"></div>

<script>
// Inicializar el slider cuando el contenido esté cargado
(function() {
    console.log('Script del slider ejecutándose');

    if (window.SliderController) {
        console.log('SliderController encontrado, inicializando...');
        // Inicializar inmediatamente
        setTimeout(function() {
            window.SliderController.init();
        }, 10);
    } else {
        console.error('SliderController no encontrado');
    }
})();
</script>
