<script>
// Inicializar el slider y el historial de canciones cuando el contenido esté cargado
(function() {
    console.log('Script del slider ejecutándose');

    if (window.SliderController) {
        console.log('SliderController encontrado, inicializando...');
        // Dar tiempo al DOM para renderizarse completamente
        setTimeout(function() {
            console.log('Inicializando slider ahora...');
            window.SliderController.init();
            // Verificar que el auto-slide esté funcionando
            setTimeout(function() {
                if (window.SliderController.autoSlideInterval) {
                    console.log('Auto-slide está activo');
                } else {
                    console.warn('Auto-slide NO está activo, reintentando...');
                    window.SliderController.startAutoSlide();
                }
            }, 100);
        }, 100);
    } else {
        console.error('SliderController no encontrado');
    }

    // Inicializar historial de canciones
    if (window.HistoryController) {
        if (window.HistoryController.intervalId) {
            window.HistoryController.destroy();
        }
        window.HistoryController.init();
    }
})();
</script>
