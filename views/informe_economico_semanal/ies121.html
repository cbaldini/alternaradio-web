<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- CSS  -->
<link href="../../style.css" rel="stylesheet" type="text/css" />
<link href="https://vjs.zencdn.net/8.3.0/video-js.css" rel="stylesheet" />
<title>Alterna Radio FM 88.1 MHZ</title>
<link rel="icon" type="image/x-icon" href="../../favicon.png">
    <script src="../../js/config.js"></script>
    <script type="text/javascript">
        (function() {
            window.Copy = function() {
                var url = CONFIG.domain + "#ies/ies121";
                var messageDiv = document.getElementById("copyMessage");

                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(url)
                        .then(function() {
                            if (messageDiv) {
                                messageDiv.innerHTML = '¡Vínculo <strong>' + url + '</strong> copiado al portapapeles!';
                                messageDiv.style.display = 'block';
                            }
                        })
                        .catch(function() {
                            fallbackCopy(url, messageDiv);
                        });
                } else {
                    fallbackCopy(url, messageDiv);
                }
            };

            function fallbackCopy(url, messageDiv) {
                var textarea = document.createElement('textarea');
                textarea.value = url;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.focus();
                textarea.select();

                try {
                    var success = document.execCommand('copy');
                    if (success && messageDiv) {
                        messageDiv.innerHTML = '¡Vínculo <strong>' + url + '</strong> copiado al portapapeles!';
                        messageDiv.style.display = 'block';
                    }
                } catch(err) {
                    // no-op
                }
                document.body.removeChild(textarea);
            }
        })();
    </script>
</head>
<body class="program-page" style="background-color:#0f0f0f; text-align: center;">
<div class="container">
<div class="flyer program-select-container" data-program-select="ies">
<h2>Informe Económico Semanal</h2>
<h3>121 - "Deudas y mora: dos caras de la misma moneda"</h3>
<div style="text-align: center; margin: 20px 0;">
<button onclick="Copy()" class="copy-button">Copiar enlace</button>
<div id="copyMessage" style="display:none; margin-top:10px; color: #4CAF50;"></div>
</div>
<div style="text-align: center; margin-top: 30px;">
<img src="../../img/ies.png" width="400" height="600" alt="Informe Económico Semanal" style="display: block; margin: 0 auto;">
</div>
</div>
</div>
<script src="../../js/program-select.js"></script>
</body>
</html>
